services:
  - type: web
    name: yourtube-2
    runtime: node
    plan: free
    branch: yourtube2.0
    buildCommand: npm --prefix server ci --include=dev && npm --prefix yourtube ci --include=dev && npm --prefix yourtube run build
    startCommand: cd server && node render.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: yourtube2
      - key: COOKIE_SECURE
        value: "true"
      - key: EMAIL_DELIVERY_DISABLED
        value: "true"
      - key: MEDIA_STORAGE
        value: gridfs
      - key: PAID_ACCESS_DISABLED
        value: "true"
